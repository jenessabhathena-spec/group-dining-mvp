<script>
// SAMPLE DATA ONLY. Restaurant names are fictional placeholders so nothing here is mistaken for real
// listings. Replace with the curated 50-100 place list from the curation tool (A1).

const AREAS = {
  Koramangala: { lat: 12.9352, lng: 77.6245 },
  "HSR Layout": { lat: 12.9116, lng: 77.6474 },
  Indiranagar: { lat: 12.9784, lng: 77.6408 },
  Domlur: { lat: 12.9609, lng: 77.6387 },
  "BTM Layout": { lat: 12.9166, lng: 77.6101 },
  Jayanagar: { lat: 12.925, lng: 77.5938 },
  Marathahalli: { lat: 12.9569, lng: 77.7011 },
};

const loc = (area, dLat = 0, dLng = 0) => ({
  area,
  lat: AREAS[area].lat + dLat,
  lng: AREAS[area].lng + dLng,
});

const h = (open, close) => ({ open, close });
// Same hours every day except one closed day (weekly format, see isOpen in engine.js).
const closedOn = (day, open, close) => ({
  weekly: Object.fromEntries(["sun", "mon", "tue", "wed", "thu", "fri", "sat"].map((d) => [d, d === day ? [] : [[open, close]]])),
});

const RESTAURANTS = [
  { id: "r01", name: "Sample Tandoor House", ...loc("Koramangala", 0.002, 0.003), pricePerHead: 900, cuisines: ["north-indian", "mughlai"], dietOptions: ["veg", "non-veg"], vibes: ["lively", "chill"], maxGroup: 10, alcohol: "serves", noise: "medium", hours: h("12:00", "23:30"), partner: true, rating: 4.2 },
  { id: "r02", name: "Sample Dosa Lane", ...loc("Koramangala", -0.004, 0.001), pricePerHead: 350, cuisines: ["south-indian"], dietOptions: ["veg", "vegan", "jain"], vibes: ["quick", "chill"], maxGroup: 8, alcohol: "none", noise: "medium", hours: h("07:00", "22:30"), partner: false, rating: 4.4 },
  { id: "r03", name: "Sample Noodle Bar", ...loc("Indiranagar", 0.003, -0.002), pricePerHead: 1100, cuisines: ["pan-asian", "japanese"], dietOptions: ["veg", "non-veg"], vibes: ["lively", "fancy"], maxGroup: 8, alcohol: "serves", noise: "loud", hours: h("12:00", "23:00"), partner: false, rating: 4.5 },
  { id: "r04", name: "Sample Wood-fired Pizza", ...loc("Indiranagar", -0.002, 0.004), pricePerHead: 1000, cuisines: ["italian"], dietOptions: ["veg", "non-veg"], vibes: ["chill", "lively"], maxGroup: 12, alcohol: "serves", noise: "medium", hours: h("12:00", "23:30"), partner: true, rating: 4.1 },
  { id: "r05", name: "Sample Thali Kitchen", ...loc("HSR Layout", 0.003, 0.002), pricePerHead: 450, cuisines: ["gujarati", "north-indian"], dietOptions: ["veg", "jain"], vibes: ["quick", "chill"], maxGroup: 12, alcohol: "none", noise: "medium", hours: closedOn("mon", "11:30", "22:30"), partner: false, rating: 4.3 },
  { id: "r06", name: "Sample Brew & Bites", ...loc("HSR Layout", -0.003, -0.003), pricePerHead: 800, cuisines: ["continental", "cafe"], dietOptions: ["veg", "vegan", "non-veg"], vibes: ["chill"], maxGroup: 8, alcohol: "serves", noise: "quiet", hours: h("09:00", "23:00"), partner: false, rating: 4.0 },
  { id: "r07", name: "Sample Biryani Co.", ...loc("Koramangala", 0.005, -0.004), pricePerHead: 600, cuisines: ["hyderabadi", "mughlai"], dietOptions: ["veg", "non-veg"], vibes: ["quick", "lively"], maxGroup: 10, alcohol: "none", noise: "medium", hours: h("11:00", "23:59"), partner: false, rating: 4.2 },
  { id: "r08", name: "Sample Rooftop Grill", ...loc("Indiranagar", 0.006, 0.001), pricePerHead: 1600, cuisines: ["grill", "continental"], dietOptions: ["veg", "non-veg"], vibes: ["fancy", "lively"], maxGroup: 10, alcohol: "bar", noise: "loud", hours: h("17:00", "01:00"), partner: true, rating: 4.4 },
  { id: "r09", name: "Sample Coastal Kitchen", ...loc("HSR Layout", 0.001, 0.006), pricePerHead: 1050, cuisines: ["coastal", "seafood"], dietOptions: ["veg", "non-veg"], vibes: ["chill", "fancy"], maxGroup: 8, alcohol: "serves", noise: "medium", hours: h("12:00", "23:00"), partner: false, rating: 4.3 },
  { id: "r10", name: "Sample Vegan Table", ...loc("Koramangala", -0.001, -0.006), pricePerHead: 750, cuisines: ["vegan", "continental"], dietOptions: ["veg", "vegan", "jain"], vibes: ["chill", "quiet"], maxGroup: 6, alcohol: "none", noise: "quiet", hours: h("10:00", "22:00"), partner: false, rating: 4.1 },
  { id: "r11", name: "Sample Street Chaat Club", ...loc("Indiranagar", -0.005, -0.005), pricePerHead: 300, cuisines: ["street-food", "north-indian"], dietOptions: ["veg", "jain"], vibes: ["quick", "lively"], maxGroup: 10, alcohol: "none", noise: "loud", hours: h("16:00", "23:00"), partner: false, rating: 4.0 },
  { id: "r12", name: "Sample Dim Sum House", ...loc("HSR Layout", -0.005, 0.002), pricePerHead: 950, cuisines: ["chinese", "pan-asian"], dietOptions: ["veg", "non-veg"], vibes: ["lively", "chill"], maxGroup: 10, alcohol: "serves", noise: "medium", hours: h("12:00", "23:00"), partner: false, rating: 4.2 },
  { id: "r13", name: "Sample Late-night Diner", ...loc("Koramangala", 0.004, 0.006), pricePerHead: 650, cuisines: ["american", "cafe"], dietOptions: ["veg", "non-veg"], vibes: ["quick", "lively"], maxGroup: 8, alcohol: "none", noise: "medium", hours: h("18:00", "02:00"), partner: false, rating: 3.9 },
  { id: "r14", name: "Sample Fine Dine South", ...loc("Indiranagar", 0.001, 0.007), pricePerHead: 1800, cuisines: ["south-indian", "kerala"], dietOptions: ["veg", "non-veg"], vibes: ["fancy", "quiet"], maxGroup: 8, alcohol: "serves", noise: "quiet", hours: closedOn("mon", "12:00", "23:00"), partner: false, rating: 4.6 },
];

// Fair-pick engine (PRD section 6): transparent rules, no ML.
// Pure functions. Travel-time lookup is injected so Google Maps can replace the fallback later.

const DEFAULT_WEIGHTS = { taste: 1, fairness: 1, mood: 1, novelty: 1, quality: 1 };
const DEFAULTS = {
  travelLimitMin: 40,
  travelRelaxStepMin: 10,
  travelRelaxMaxSteps: 3,
  budgetRelaxSteps: [1.05, 1.1, 1.15], // up to 15% over the lowest budget
  pickCount: 3,
  smallGroupMax: 3, // groups of 2-3: no budget relaxation, generic budget labels (budget secrecy)
};

// ---------- travel ----------

function haversineKm(a, b) {
  const R = 6371;
  const rad = (d) => (d * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Straight-line fallback (PRD section 8, Reliability). Road factor + rough Bengaluru speeds.
function fallbackTravelMinutes(from, to, hour) {
  const peak = (hour >= 8 && hour < 11) || (hour >= 17 && hour < 22);
  const kmh = peak ? 14 : 24;
  return Math.round(((haversineKm(from, to) * 1.4) / kmh) * 60) + 5;
}

// ---------- helpers ----------

const toMin = (t) => {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + (m || 0);
};
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const round2 = (x) => Math.round(x * 100) / 100;

// ---------- opening hours ----------
// hours is either { open, close } (same every day) or { weekly: { mon: [["12:00","15:00"],["19:00","23:00"]], ... } }.
// A window that closes after midnight ("17:00"-"01:00") belongs to the day it opens on.
const DAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
function dayOf(date) {
  const [y, m, d] = date.split("-").map(Number);
  return DAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}
const windowsOn = (r, day) => (r.hours.weekly ? r.hours.weekly[day] || [] : [[r.hours.open, r.hours.close]]);

// With a date, the day of the week counts (closed on Mondays means closed on Mondays). Without one the
// weekday is unknown, so a place counts as open if it is open at that time on any day.
function isOpen(restaurant, time, date) {
  const x = toMin(time);
  const days = date ? [dayOf(date)] : DAYS;
  return days.some((day) => {
    const prev = DAYS[(DAYS.indexOf(day) + 6) % 7];
    const today = windowsOn(restaurant, day).some(([o, c]) => {
      const O = toMin(o), C = toMin(c);
      return C > O ? x >= O && x < C : x >= O; // wrapping window: open from O until midnight today
    });
    const spill = windowsOn(restaurant, prev).some(([o, c]) => {
      const O = toMin(o), C = toMin(c);
      return C <= O && x < C; // yesterday's late window still open after midnight
    });
    return today || spill;
  });
}

const NOISE_RANK = { quiet: 0, medium: 1, loud: 2 };

const DEALBREAKERS = {
  "needs-veg": (r) => !r.dietOptions.includes("veg"),
  "needs-vegan": (r) => !r.dietOptions.includes("vegan"),
  "needs-jain": (r) => !r.dietOptions.includes("jain"),
  "no-alcohol": (r) => r.alcohol === "bar",
  "no-loud": (r) => r.noise === "loud",
};

function profileToMember(m) {
  const p = m.profile;
  return {
    name: m.name,
    start: p.start,
    budget: null,
    dealbreakers: p.dealbreakers || [],
    mood: null,
    cuisines: p.cuisines || [],
    visited: p.visited || [],
    fromProfile: true,
  };
}

// ---------- stage 1 + 2: filters ----------

function evaluate(r, members, groupSize, plan, ceiling, travelFn) {
  const hard = [];
  if (!isOpen(r, plan.time, plan.date)) hard.push({ rule: "closed", detail: "Closed at the plan time" });
  for (const m of members) {
    for (const d of m.dealbreakers || []) {
      if (DEALBREAKERS[d] && DEALBREAKERS[d](r)) {
        hard.push({ rule: "dealbreaker", detail: "Breaks a dealbreaker" });
        break;
      }
    }
    if (hard.some((h) => h.rule === "dealbreaker")) break;
  }
  if (groupSize > r.maxGroup) hard.push({ rule: "seating", detail: "Cannot seat the group" });
  // Couples mode filters (F12): noise ceiling and ambience, both optional.
  const f = plan.filters || {};
  if (f.maxNoise && NOISE_RANK[r.noise] > NOISE_RANK[f.maxNoise]) hard.push({ rule: "noise", detail: "Louder than wanted" });
  if (f.ambience && f.ambience.length && !r.vibes.some((v) => f.ambience.includes(v))) hard.push({ rule: "ambience", detail: "Not the ambience wanted" });
  if (hard.length) return { r, hard, times: null };

  // One travel lookup per member per candidate, only after the hard filters (cost control).
  const hour = Number(plan.time.split(":")[0]);
  const times = members.map((m) => ({ name: m.name, minutes: travelFn(m.start, r, hour) }));
  const worst = times.reduce((a, b) => (b.minutes > a.minutes ? b : a));
  return {
    r,
    hard,
    times,
    worst,
    budgetRatio: r.pricePerHead / ceiling, // Infinity ceiling -> 0
  };
}

// ---------- stage 3: scoring ----------

function scoreRestaurant(r, members, times, limit, weights) {
  const n = members.length;
  const tasteHits = [];
  let taste = 0;
  for (const m of members) {
    if (!m.cuisines || m.cuisines.length === 0) taste += 0.5;
    else if (r.cuisines.some((c) => m.cuisines.includes(c))) {
      taste += 1;
      tasteHits.push(m);
    }
  }
  taste /= n;

  const minutes = times.map((t) => t.minutes);
  const spread = Math.max(...minutes) - Math.min(...minutes);
  const fairness = clamp01(1 - spread / limit);

  // A member's mood may be one vibe or several (taste profile); any match counts.
  let mood = 0;
  const moodHits = [];
  const vibeCount = {};
  for (const m of members) {
    const moods = [].concat(m.mood || []);
    if (!moods.length) mood += 0.5;
    else {
      const hit = moods.find((v) => r.vibes.includes(v));
      if (hit) {
        mood += 1;
        moodHits.push(m);
        vibeCount[hit] = (vibeCount[hit] || 0) + 1;
      }
    }
  }
  mood /= n;
  const moodVibe = Object.entries(vibeCount).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1))[0]?.[0];

  const newFor = members.filter((m) => !(m.visited || []).includes(r.id));
  const novelty = newFor.length / n;
  const quality = clamp01((r.rating - 1) / 4);

  const factors = { taste, fairness, mood, novelty, quality };
  const wsum = Object.values(weights).reduce((a, b) => a + b, 0);
  const total = Object.keys(factors).reduce((s, k) => s + factors[k] * weights[k], 0) / wsum;
  return {
    factors: Object.fromEntries(Object.entries(factors).map(([k, v]) => [k, round2(v)])),
    total: round2(total),
    _hits: { taste: tasteHits.length, mood: moodHits.length, novelty: newFor.length, moodVibe },
  };
}

const byRank = (a, b) =>
  b.total - a.total || b.factors.fairness - a.factors.fairness || (a.r.id < b.r.id ? -1 : 1);

// ---------- stage 4: diversity ----------

function selectDiverse(ranked, count) {
  const chosen = [];
  const same = (a, b) => a.r.cuisines[0] === b.r.cuisines[0] && a.r.vibes[0] === b.r.vibes[0];
  for (const c of ranked) {
    if (chosen.length === count) break;
    if (!chosen.some((s) => same(s, c))) chosen.push(c);
  }
  for (const c of ranked) {
    if (chosen.length === count) break;
    if (!chosen.includes(c)) chosen.push(c);
  }
  return chosen.sort(byRank);
}

// ---------- stage 5: explain ----------

function explain(c, members, budgetRelaxed) {
  const parts = [];
  const n = members.length;
  const solo = n === 1; // "find something new" speaks to one person
  const withBudget = members.filter((m) => m.budget != null).length;
  if (withBudget > 0) {
    // Only claim "all N" when everyone gave a budget; otherwise say what is true.
    const everyone = withBudget === n;
    parts.push(budgetRelaxed ? "Slightly above the shared budget" : solo ? "Within your budget" : everyone ? `Fits all ${withBudget} budgets` : withBudget === 1 ? "Within the budget given" : `Within the ${withBudget} budgets given`);
  }
  parts.push(solo ? `${c.worst.minutes} min away` : `longest trip ${c.worst.minutes} min (${c.worst.name})`);

  const opts = [];
  if (c._hits.taste > 0) {
    const cuisine = c.r.cuisines.find((cu) => members.some((m) => (m.cuisines || []).includes(cu)));
    opts.push({ v: c.factors.taste, t: solo ? `your kind of food: ${cuisine}` : `${c._hits.taste} of ${n} wanted ${cuisine}`, o: 0 });
  }
  if (c._hits.novelty > 0) opts.push({ v: c.factors.novelty, t: solo ? "new to you" : `new for ${c._hits.novelty}`, o: 1 });
  if (c._hits.mood > 0)
    opts.push({ v: c.factors.mood, t: solo ? `fits your ${c._hits.moodVibe} mood` : `${c._hits.mood} of ${n} in the mood for ${c._hits.moodVibe}`, o: 2 });
  opts.sort((a, b) => b.v - a.v || a.o - b.o);
  for (const o of opts.slice(0, 2)) parts.push(o.t);
  const line = parts.join(" · ");
  return line.charAt(0).toUpperCase() + line.slice(1);
}

// ---------- main ----------

/**
 * @param input {
 *   plan: { time:'20:00', travelLimitMin? },
 *   members: [{ name, start:{lat,lng}, budget, dealbreakers, mood, cuisines, visited }],
 *   unanswered?: [{ name, profile? }],
 *   restaurants: [...],
 *   weights?, travelFn?
 * }
 */
function generatePicks(input) {
  const { plan, restaurants } = input;
  const weights = { ...DEFAULT_WEIGHTS, ...(input.weights || {}) };
  const baseLimit = plan.travelLimitMin ?? DEFAULTS.travelLimitMin;
  const notes = [];

  const answered = input.members;
  const fromProfile = [];
  for (const u of input.unanswered || []) {
    if (u.profile) {
      fromProfile.push(profileToMember(u));
      notes.push(`Used ${u.name}'s saved profile (no answer yet)`);
    } else {
      notes.push(`Planned without ${u.name}`);
    }
  }
  const members = [...answered, ...fromProfile];
  const groupSize = members.length + (input.unanswered || []).filter((u) => !u.profile).length;

  const budgets = members.map((m) => m.budget).filter((b) => b != null);
  const baseCeiling = budgets.length ? Math.min(...budgets) : Infinity;
  // Budget secrecy in small groups (2-3 people): saying a place is "above the shared budget", or stretching the
  // budget and saying so, tells a member roughly what another member's budget is. So in small groups the budget
  // is never relaxed, and budget near misses get a generic label. (Solo: it's your own budget, no secret.)
  const smallGroup = groupSize >= 2 && groupSize <= DEFAULTS.smallGroupMax;
  // For the "₹800-1,200 a head works for all" line (PRD content rules): did everyone in the plan give a budget?
  const missing = (input.unanswered || []).some((u) => !u.profile);
  const budgetScope = !budgets.length ? "none" : budgets.length === members.length && !missing ? "all" : "given";

  // Travel: injected fn with straight-line fallback if it throws.
  let travelFallback = false;
  const userFn = input.travelFn || fallbackTravelMinutes;
  const travelFn = (a, b, h) => {
    try {
      return userFn(a, b, h);
    } catch {
      travelFallback = true;
      return fallbackTravelMinutes(a, b, h);
    }
  };
  if (!input.travelFn) travelFallback = true;

  const evals = restaurants.map((r) => evaluate(r, members, groupSize, plan, baseCeiling, travelFn));
  // Checked after the lookups: the service may fail part-way through.
  if (travelFallback) notes.push("Travel times are straight-line estimates");
  const candidates = evals.filter((e) => e.hard.length === 0);

  const passing = (mul, limit) =>
    candidates.filter((e) => e.budgetRatio <= mul && e.worst.minutes <= limit);

  // Relaxation order: travel limit first, then budget ceiling up to +15%.
  let limit = baseLimit;
  let budgetMul = 1;
  let passes = passing(budgetMul, limit);
  let relaxation = null;
  if (passes.length === 0) {
    const steps = [];
    for (let i = 1; i <= DEFAULTS.travelRelaxMaxSteps; i++)
      steps.push({ limit: baseLimit + i * DEFAULTS.travelRelaxStepMin, mul: 1 });
    const maxLimit = baseLimit + DEFAULTS.travelRelaxMaxSteps * DEFAULTS.travelRelaxStepMin;
    if (!smallGroup) for (const mul of DEFAULTS.budgetRelaxSteps) steps.push({ limit: maxLimit, mul });
    for (const s of steps) {
      const p = passing(s.mul, s.limit);
      if (p.length) {
        passes = p;
        limit = s.limit;
        budgetMul = s.mul;
        relaxation = {
          travel: limit > baseLimit ? { from: baseLimit, to: limit } : null,
          budget: budgetMul > 1,
        };
        break;
      }
    }
  }

  const scored = passes
    .map((e) => ({ ...e, ...scoreRestaurant(e.r, members, e.times, limit, weights) }))
    .sort(byRank);
  const chosen = selectDiverse(scored, DEFAULTS.pickCount);
  const reserve = scored.filter((c) => !chosen.includes(c)).map((c) => shape(c, members, baseLimit, baseCeiling, budgetMul, notes));
  const picks = chosen.map((c) => shape(c, members, baseLimit, baseCeiling, budgetMul, notes));

  // Near misses when fewer than 3 passed.
  let nearMisses = [];
  if (picks.length < DEFAULTS.pickCount) {
    const passIds = new Set(passes.map((e) => e.r.id));
    nearMisses = candidates
      .filter((e) => !passIds.has(e.r.id))
      .map((e) => {
        const travelOver = Math.max(0, e.worst.minutes - limit);
        const budgetOver = Math.max(0, e.budgetRatio - budgetMul);
        const broken = [];
        if (travelOver > 0) broken.push({ rule: "travel", detail: `Trip over the limit: ${e.worst.minutes} min for ${e.worst.name}` });
        if (budgetOver > 0) broken.push(smallGroup ? { rule: "fit", detail: "Doesn't suit everyone" } : { rule: "budget", detail: "Above the group's shared budget" });
        return { e, broken, gap: travelOver / limit + budgetOver };
      })
      .sort((a, b) => a.broken.length - b.broken.length || a.gap - b.gap || (a.e.r.id < b.e.r.id ? -1 : 1))
      .slice(0, DEFAULTS.pickCount - picks.length + 2)
      .map(({ e, broken }) => ({
        id: e.r.id,
        name: e.r.name,
        area: e.r.area,
        pricePerHead: e.r.pricePerHead,
        partner: !!e.r.partner,
        travel: e.times,
        broken,
        nearMiss: true,
      }));
  }

  const log = {
    // A2 plan log: logged in full for weekly review (budgets stay server-side).
    inputs: {
      plan,
      members: members.map((m) => ({ ...m })),
      unanswered: input.unanswered || [],
      weights,
    },
    filtered: evals.filter((e) => e.hard.length).map((e) => ({ id: e.r.id, rules: e.hard.map((h) => h.rule) })),
    relaxation,
    ranked: scored.map((c) => ({ id: c.r.id, total: c.total, factors: c.factors })),
    picks: picks.map((p) => p.id),
  };

  return { picks, reserve, nearMisses, relaxation, notes, travelFallback, budget: { scope: budgetScope, relaxed: budgetMul > 1 }, log };
}

function shape(c, members, baseLimit, baseCeiling, budgetMul, notes) {
  const tradeoffs = [];
  if (c.worst.minutes > baseLimit) {
    const over = c.worst.minutes - baseLimit;
    tradeoffs.push(
      `${over} min past the ${baseLimit}-min limit for ${c.worst.name}` +
        (c.r.pricePerHead <= baseCeiling ? " but fits every budget" : "")
    );
  }
  if (c.budgetRatio > 1) tradeoffs.push("A little above the shared budget");
  return {
    id: c.r.id,
    name: c.r.name,
    area: c.r.area,
    pricePerHead: c.r.pricePerHead,
    partner: !!c.r.partner, // badge only; never an input to filtering or scoring
    travel: c.times, // per person, by first name
    total: c.total,
    factors: c.factors,
    reason: explain(c, members, budgetMul > 1 && c.budgetRatio > 1),
    tradeoffs,
    notes: notes.filter((n) => !n.startsWith("Travel times")), // member notes shown on the cards
    travelEstimate: notes.some((n) => n.startsWith("Travel times")),
  };
}

// Vote and veto (PRD F9). Pure, deterministic: the same inputs always give the same winner.

function createSession(result, memberNames) {
  return {
    members: [...memberNames],
    shown: result.picks.slice(0, 3),
    reserve: [...result.reserve],
    votes: {}, // member -> pickId
    vetoes: {}, // member -> pickId
    removed: [],
    events: [],
  };
}

const clone = (s) => ({
  ...s,
  shown: [...s.shown],
  reserve: [...s.reserve],
  votes: { ...s.votes },
  vetoes: { ...s.vetoes },
  removed: [...s.removed],
  events: [...s.events],
});

function assertMember(s, member) {
  if (!s.members.includes(member)) throw new Error(`Unknown member: ${member}`);
}

function vote(s, member, pickId) {
  assertMember(s, member);
  if (member in s.votes) throw new Error(`${member} has already voted`);
  if (!s.shown.some((p) => p.id === pickId)) throw new Error("Pick is not on the table");
  const n = clone(s);
  n.votes[member] = pickId;
  n.events.push({ type: "vote_cast", member, pickId });
  return n;
}

// One veto each. A veto swaps in the next-best pick once; voting does not restart.
function veto(s, member, pickId) {
  assertMember(s, member);
  if (member in s.vetoes) throw new Error(`${member} has already used their veto`);
  const idx = s.shown.findIndex((p) => p.id === pickId);
  if (idx === -1) throw new Error("Pick is not on the table (already replaced?)");
  const n = clone(s);
  n.vetoes[member] = pickId;
  n.removed.push(pickId);
  const next = n.reserve.shift();
  if (next) n.shown[idx] = next;
  else n.shown.splice(idx, 1);
  // Votes for the removed pick are void; those voters vote again.
  for (const [m, id] of Object.entries(n.votes)) if (id === pickId) delete n.votes[m];
  n.events.push({ type: "pick_vetoed", member, pickId, replacedBy: next ? next.id : null });
  return n;
}

function isComplete(s, { deadlinePassed = false } = {}) {
  return deadlinePassed || s.members.every((m) => m in s.votes);
}

const tally = (s) => {
  const counts = Object.fromEntries(s.shown.map((p) => [p.id, 0]));
  for (const id of Object.values(s.votes)) if (id in counts) counts[id]++;
  return counts;
};

// Most votes wins; a tie goes to the higher fairness score; then total score; then id.
function decide(s) {
  const counts = tally(s);
  const ranked = [...s.shown].sort(
    (a, b) =>
      counts[b.id] - counts[a.id] ||
      b.factors.fairness - a.factors.fairness ||
      b.total - a.total ||
      (a.id < b.id ? -1 : 1)
  );
  return { winner: ranked[0] || null, counts, overridden: false };
}

// Organiser may override; allowed but logged (frequent overrides mean the engine is not trusted).
function override(s, by, pickId) {
  const pool = [...s.shown, ...s.reserve];
  const pick = pool.find((p) => p.id === pickId);
  if (!pick) throw new Error("Unknown pick");
  const was = decide(s).winner;
  const n = clone(s);
  n.events.push({ type: "organiser_override", by, pickId, was: was ? was.id : null });
  return { session: n, winner: pick, overridden: true };
}

</script>

  const msg = `We're going to ${w.name} (${w.area}), ${S.plan.date} at ${S.plan.time}. ${w.reason}`;
  return `<h2>It's ${esc(w.name)}!</h2><p class="sub">${esc(w.area)} · ${money(w.pricePerHead)} a head${S.overridden ? " · organiser's choice" : ""}</p>
  <div class="card"><div class="why">${esc(w.reason)}</div><div class="trav">${w.travel.map((t) => `${esc(t.name)} ${t.minutes} min`).join(" · ")}</div>${w.partner ? `<span class="badge">Partner</span>` : ""}</div>
  <a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Share to WhatsApp</a>
  <div class="row"><button class="btn sec sm" data-act="call">Call</button>
  <a class="btn sec sm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${rest.lat},${rest.lng}">Directions</a>
  <button class="btn sec sm" data-act="book">Booking app</button></div>
  <button class="btn sec" data-act="torating">Next day: How was it?</button>
  <p class="mute">Closed or changed? <a href="#" data-act="report" style="color:var(--acc)">Tell us</a></p>`;
};

V.rating = () => {
  const names = S.session ? S.session.members : members();
  const w = S.winner;
  if (S.rated) {
    const went = Object.values(S.ratings).filter((r) => r.went === "yes").length;
    const rs = Object.values(S.ratings).map((r) => r.stars).filter(Boolean);
    return `<h2>Thanks!</h2><p class="sub">Stored against the plan and fed to the metrics.</p>
    <div class="card">Visit rate: <b>${Math.round((went / Math.max(1, names.length)) * 100)}%</b> went<br>Pick satisfaction: <b>${rs.length ? (rs.reduce((a, b) => a + b, 0) / rs.length).toFixed(1) : "-"}</b> / 5</div>
    <button class="btn" data-act="restart">Start another plan</button>`;
  }
  return `<h2>How was it?</h2><p class="sub">${w ? esc(w.name) : "Your plan"} · tap to answer</p>
  ${names.map((n) => { const r = S.ratings[n] || {}; return `<div class="card"><b>${esc(n)}</b>
    <div class="chips" style="margin:6px 0">${[["yes", "Went"], ["no", "Didn't go"], ["elsewhere", "Went elsewhere"]].map(([k, l]) => `<span class="chip ${r.went === k ? "on" : ""}" data-act="went" data-n="${esc(n)}" data-v="${k}">${l}</span>`).join("")}</div>
    <div class="stars">${[1, 2, 3, 4, 5].map((i) => `<button class="${(r.stars || 0) >= i ? "on" : ""}" data-act="star" data-n="${esc(n)}" data-v="${i}" aria-label="${i} stars">★</button>`).join("")}</div></div>`; }).join("")}
  <button class="btn" data-act="submitrating">Submit</button>`;
};

/* ---------- render ---------- */
function render() {
  const idx = SCREENS.findIndex((s) => s[0] === S.screen);
  $("nav").innerHTML = SCREENS.map((s, i) => `<button class="${s[0] === S.screen ? "on" : ""}" data-act="nav" data-v="${s[0]}"><b>${i + 1}</b>${s[1]}<small>${s[2]}</small></button>`).join("");
  $("top").innerHTML = `<span>${idx + 1}. ${SCREENS[idx][1]}</span><span class="as">${SCREENS[idx][2]}</span>`;
  const keepScroll = $("body").scrollTop;
  $("body").innerHTML = V[S.screen]();
  $("body").scrollTop = keepScroll;
  $("payload").textContent = S.result ? JSON.stringify({ picks: S.result.picks, reserve: S.result.reserve.slice(0, 2) }, null, 1) : "Generate picks first.";
  $("planlog").textContent = S.result ? JSON.stringify({ engine: S.result.log, events: S.log }, null, 1) : "Nothing yet.";
}

function setPath(path, value) {
  const parts = path.split("."); let o = S;
  while (parts.length > 1) o = o[parts.shift()];
  o[parts[0]] = value;
}

document.addEventListener("input", (e) => { const b = e.target.dataset && e.target.dataset.bind; if (b && e.target.tagName === "INPUT") setPath(b, e.target.value); if (e.target.id === "phone") S.phone = e.target.value; });
document.addEventListener("change", (e) => { const b = e.target.dataset && e.target.dataset.bind; if (b && e.target.tagName === "SELECT") { setPath(b, e.target.value); if (b === "viewer" || b === "friendDraft.name") render(); } });

const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, n = el.dataset.n;
  if (act === "report") e.preventDefault();
  try {
    switch (act) {
      case "nav": go(v); return;
      case "sendcode": S.codeSent = true; return render();
      case "verify": return go("profile");
      case "pcuisine": S.profile.cuisines = toggle(S.profile.cuisines, v); return render();
      case "pvibe": S.profile.vibe = toggle(S.profile.vibe, v); return render();
      case "saveprofile": logEv("profile_completed"); return go("home");
      case "editprofile": return go("profile");
      case "newplan": return go("newplan");
      case "shareplan": S.shared = true; S.responses = {}; S.result = null; S.session = null; logEv("plan_created"); logEv("plan_shared"); window.open("https://wa.me/?text=" + encodeURIComponent(waText()), "_blank", "noopener"); return go("status");
      case "toStatus": return go("status");
      case "openfriend": S.friendDraft = { name: "", area: "Koramangala", budget: "", dealbreakers: [], mood: "chill" }; logEv("link_opened"); return go("friend");
      case "fdb": S.friendDraft.dealbreakers = toggle(S.friendDraft.dealbreakers, v); return render();
      case "fmood": S.friendDraft.mood = v; return render();
      case "submitfriend": {
        const d = S.friendDraft;
        if (!d.name) return toast("Choose your name first");
        S.responses[d.name] = { area: d.area, budget: d.budget, dealbreakers: d.dealbreakers, mood: d.mood, cuisines: [] };
        logEv("response_submitted", { name: d.name }); return go("waiting");
      }
      case "backorg": return go("status");
      case "fillall": friends().forEach((f) => { S.responses[f] = DEMO[f] || { area: "Koramangala", budget: 1000, mood: "chill", dealbreakers: [], cuisines: [] }; }); return render();
      case "getpicks": return runEngine();
      case "backstatus": return go("status");
      case "vote": S.session = vote(S.session, S.viewer, v); maybeDecide(); return render();
      case "veto": S.session = veto(S.session, S.viewer, v); logEv("pick_vetoed", { by: S.viewer, id: v }); return render();
      case "closevote": S.winner = decide(S.session).winner; logEv("winner_decided", { id: S.winner && S.winner.id, trigger: "deadline" }); return go("winner");
      case "override": { const o = override(S.session, "Jenessa", v); S.session = o.session; S.winner = o.winner; S.overridden = true; logEv("organiser_override", { id: v }); return go("winner"); }
      case "call": return toast("Sample data has no phone numbers. Real build opens tel: link.");
      case "book": return toast("Booking-app deep links are an open question in the PRD.");
      case "report": return toast("Thanks, flagged for the weekly curation review.");
      case "torating": S.rated = false; S.ratings = {}; return go("rating");
      case "went": S.ratings[n] = { ...(S.ratings[n] || {}), went: v }; return render();
      case "star": S.ratings[n] = { ...(S.ratings[n] || {}), stars: Number(v) }; return render();
      case "submitrating": S.rated = true; logEv("visit_reported"); logEv("rating_submitted", { ratings: S.ratings }); return render();
      case "restart": S.shared = false; S.responses = {}; S.result = null; S.session = null; S.winner = null; S.rated = false; return go("home");
    }
  } catch (err) { toast(err.message); }
});

render();
</script>
</body>
</html>
